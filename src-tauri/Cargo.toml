[package]
name = "app"
version = "0.1.0"
description = "Legacy Tauri host for the Ayla coworker assistant"
authors = ["Ayla Project"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
ayla-core = { path = "../crates/ayla-core" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
sherpa-onnx = { path = "../tts/sherpa-onnx/sherpa-onnx/rust/sherpa-onnx" }

tokio = { version = "1", features = ["full"] }
