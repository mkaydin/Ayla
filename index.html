<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DemonGirl — Live2D Viewer</title>
    <!--
      Live2D Cubism Core: proprietary binary bridge from Live2D Inc.
      Free for non-commercial use. Loaded from official CDN.
      For offline/commercial use, download from https://www.live2d.com/en/sdk/download/web/
      and place locally in /public/lib/live2dcubismcore.js
    -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #1a1a1a; color: #eee;
                   font-family: system-ui, sans-serif; overflow: hidden; }
      #canvas { display: block; width: 100vw; height: 100vh; }
      #hud {
        position: fixed; top: 12px; left: 12px; z-index: 10;
        background: rgba(0,0,0,0.55); padding: 12px 16px; border-radius: 8px;
        font-size: 13px; line-height: 1.6; backdrop-filter: blur(6px);
        max-width: 320px;
      }
      #hud h1 { font-size: 14px; margin: 0 0 8px 0; }
      #hud kbd {
        background:#333; border:1px solid #555; border-radius:3px;
        padding:1px 6px; font-size:11px; font-family: monospace;
      }
      #status { color:#7fd1ff; margin-top:8px; font-size:12px; min-height:1em; }
      .meters { margin-top:8px; font-size:11px; color:#aaa; }
      .bar { display:inline-block; width:120px; height:6px; background:#333; border-radius:3px;
             overflow:hidden; vertical-align:middle; }
      .bar > i { display:block; height:100%; background:#7fd1ff; width:0%; }
      .expr-btn {
        background:#2a2a2a; color:#ccc; border:1px solid #444;
        border-radius:4px; padding:2px 7px; font-size:11px;
        cursor:pointer; white-space:nowrap; user-select:none;
      }
      .expr-btn:hover { background:#3a3a3a; color:#fff; border-color:#7fd1ff; }
      .expr-btn:active { background:#444; }
      .ctrl-btn {
        background:#2a2a2a; color:#aaa; border:1px solid #444;
        border-radius:4px; padding:2px 8px; font-size:11px;
        cursor:pointer; white-space:nowrap; user-select:none;
        transition: background 0.15s;
      }
      .ctrl-btn:hover { background:#333; color:#fff; border-color:#666; }
      .ctrl-btn:active { background:#444; }

      /* ── Chatbox ──────────────────────────────────────────────── */
      #chatbox {
        position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
        width: min(640px, 92vw); max-height: 60vh; z-index: 100;
        background: rgba(18,18,28,0.58); backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid rgba(255,255,255,0.09);
        border-radius: 14px; display: flex; flex-direction: column;
        box-shadow: 0 8px 36px rgba(0,0,0,0.45);
        transition: opacity 0.25s, transform 0.25s;
      }
      #chatbox.chat-hidden { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(16px); }
      #chat-header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 8px 16px; font-size: 12px; color: rgba(255,255,255,0.4);
        border-bottom: 1px solid rgba(255,255,255,0.05);
      }
      #chat-close { background: none; border: none; color: rgba(255,255,255,0.35);
                   cursor: pointer; font-size: 16px; padding: 0 4px; line-height: 1; }
      #chat-close:hover { color: #eee; }
      #chat-messages {
        flex: 0 0 auto; overflow-y: auto; padding: 12px 16px;
        display: flex; flex-direction: column; gap: 8px; height: 240px;
      }
      #chat-messages:empty::after {
        content: 'Ask me anything…'; color: rgba(255,255,255,0.18);
        text-align: center; padding: 32px 20px; font-size: 13px;
      }
      .msg { max-width: 82%; padding: 8px 14px; border-radius: 12px;
             font-size: 13px; line-height: 1.55; word-wrap: break-word;
             animation: msgIn 0.25s ease; }
      .msg.user { align-self: flex-end; background: rgba(59,130,246,0.32);
                  border: 1px solid rgba(59,130,246,0.18); color: #dce4ff; }
      .msg.model { align-self: flex-start; background: rgba(255,255,255,0.04);
                   border: 1px solid rgba(255,255,255,0.06); color: #d1d5db; }
      .msg.model h1,.msg.model h2,.msg.model h3 { font-size: 1.05em; margin: 6px 0 3px; color: #e2e8f0; }
      .msg.model p { margin: 4px 0; }
      .msg.model code { background: rgba(0,0,0,0.35); padding: 1px 5px; border-radius: 3px; font-size: 11.5px; }
      .msg.model pre { background: rgba(0,0,0,0.45); padding: 10px; border-radius: 7px; overflow-x: auto;
                       font-size: 12px; margin: 6px 0; }
      .msg.model pre code { background: none; padding: 0; }
      .msg.model ul,.msg.model ol { margin: 4px 0; padding-left: 20px; }
      .msg.model blockquote { border-left: 3px solid rgba(255,255,255,0.12);
                              margin: 6px 0; padding-left: 10px; color: #9ca3af; }
      .msg.model a { color: #93c5fd; }
      .msg.model table { border-collapse: collapse; margin: 4px 0; font-size: 12px; }
      .msg.model th,.msg.model td { border: 1px solid rgba(255,255,255,0.08); padding: 4px 8px; }
      #chat-input-row { display: flex; align-items: flex-end; padding: 8px 12px 12px;
                        gap: 8px; border-top: 1px solid rgba(255,255,255,0.05); }
      #chat-input { flex: 1; background: rgba(255,255,255,0.05);
                    border: 1px solid rgba(255,255,255,0.07); border-radius: 9px;
                    color: #eee; padding: 8px 12px; font-size: 13px;
                    font-family: inherit; resize: none; outline: none; max-height: 120px; }
      #chat-input:focus { border-color: rgba(59,130,246,0.35); }
      #chat-input::placeholder { color: rgba(255,255,255,0.2); }
      #chat-send { background: rgba(59,130,246,0.35); border: 1px solid rgba(59,130,246,0.25);
                   color: #eee; width: 34px; height: 34px; border-radius: 9px; cursor: pointer;
                   font-size: 16px; display: flex; align-items: center; justify-content: center;
                   flex-shrink: 0; transition: background 0.15s; }
      #chat-send:hover { background: rgba(59,130,246,0.55); }
      #chat-send:disabled { opacity: 0.25; cursor: default; }

      /* floating open button (shown when chat is hidden) */
      #chat-open {
        position: fixed; bottom: 20px; right: 20px; z-index: 101;
        width: 42px; height: 42px; border-radius: 50%;
        background: rgba(59,130,246,0.4); border: 1px solid rgba(59,130,246,0.3);
        color: #eee; font-size: 18px; cursor: pointer;
        display: none; align-items: center; justify-content: center;
        box-shadow: 0 4px 18px rgba(0,0,0,0.35);
        transition: background 0.15s;
      }
      #chat-open:hover { background: rgba(59,130,246,0.6); }

      @keyframes msgIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
      #chat-messages::-webkit-scrollbar { width: 5px; }
      #chat-messages::-webkit-scrollbar-track { background: transparent; }
      #chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }

    </style>
  </head>
  <body>
    <div id="hud">
      <h1>DemonGirl — Live2D</h1>
      <div style="font-size:11px;color:rgba(255,255,255,0.35);margin-bottom:4px;">
        Wheel zoom · Drag pan · Chat below ↓
      </div>
      <div id="expr-btns" style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;">
        <button data-expr="Amazed"    class="expr-btn">Amazed</button>
        <button data-expr="Angry"     class="expr-btn">Angry</button>
        <button data-expr="Cry"       class="expr-btn">Cry</button>
        <button data-expr="Love"      class="expr-btn">Love</button>
        <button data-expr="Nervous"   class="expr-btn">Nervous</button>
        <button data-expr="Sleepy"    class="expr-btn">Sleepy</button>
        <button data-expr="Customise" class="expr-btn">Custom</button>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:4px;">
        <button id="btn-blink"   class="ctrl-btn">Blink: ON</button>
        <button id="btn-lipsync" class="ctrl-btn">Mic: OFF</button>
        <button id="btn-mouse"   class="ctrl-btn">Look: ON</button>
        <button id="btn-reset"   class="ctrl-btn">Reset</button>
        <button id="btn-voice"   class="ctrl-btn">🎤 Voice</button>
      </div>
      <div id="status">Booting…</div>
      <div class="meters">
        Mic: <span class="bar"><i id="mic-bar"></i></span><br/>
        Mouth: <span class="bar"><i id="mouth-bar"></i></span>
      </div>
    </div>
    <canvas id="canvas"></canvas>

    <!-- ── Chatbox ─────────────────────────────────────────────────────── -->
    <div id="chatbox">
      <div id="chat-header">
        <span>Alice</span>
        <button id="chat-close" title="Toggle (C)">×</button>
      </div>
      <div id="chat-messages"></div>
      <div id="chat-input-row">
        <textarea id="chat-input" placeholder="Ask DemonGirl…" rows="1"></textarea>
        <button id="chat-send" title="Send">↑</button>
      </div>
    </div>

    <!-- floating button to re-open chat when hidden -->
    <button id="chat-open" title="Open Chat">💬</button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
