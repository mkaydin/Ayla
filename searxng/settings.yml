use_default_settings: true

general:
  instance_name: "Ayla Meta Search"
  debug: false
  privacypolicy_url: false
  contact_url: false
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

server:
  # `ultrasecretkey` is the canonical "unset" marker that the official SearXNG Docker
  # image's entrypoint replaces with the $SEARXNG_SECRET environment variable (issue I2).
  # Set SEARXNG_SECRET in your gitignored .env file (generate with: openssl rand -hex 32).
  secret_key: "ultrasecretkey"
  bind_address: "127.0.0.1"
  port: 8080
  # The app binds SearXNG to localhost and does not run a Valkey service.
  limiter: false
  image_proxy: false

outgoing:
  request_timeout: 30.0
  max_request_timeout: 60.0

engines:
  - name: arxiv
    engine: arxiv
    shortcut: arx
    disabled: false

  - name: pubmed
    engine: pubmed
    shortcut: pm
    disabled: false

  - name: semantic scholar
    engine: semantic_scholar
    shortcut: ss
    disabled: false

  - name: crossref
    engine: crossref
    shortcut: cr
    disabled: false

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
