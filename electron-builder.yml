appId: com.ayla.coworker.chromium
productName: Ayla
afterPack: electron/after-pack.mjs
toolsets:
  appimage: '1.0.3'
appImage:
  executableArgs: []
directories:
  output: release/electron
files:
  - dist/**/*
  - electron/main.mjs
  - electron/ipc-policy.mjs
  - electron/preload.cjs
  - electron/sidecar-manager.mjs
  - electron/sidecar-protocol.mjs
  - electron/static-server.mjs
  - electron/storage-recovery.mjs
  - electron/support-diagnostics.mjs
  - package.json
  - LICENSE
extraResources:
  - from: .electron-resources/lib
    to: lib
  - from: .electron-resources/native-manifest.json
    to: native-manifest.json
  - from: .electron-resources/licenses
    to: licenses
  - from: LICENSE
    to: licenses/AYLA_LICENSE
  - from: vendor/sherpa-onnx/sherpa-onnx/LICENSE
    to: licenses/SHERPA_ONNX_LICENSE
  - from: electron/assets/icon.png
    to: assets/icon.png
  - from: .electron-resources/bin/ayla-sidecar
    to: bin/ayla-sidecar
  - from: .electron-resources/tts/supertonic3-int8
    to: tts/supertonic3-int8
  - from: .electron-resources/models/model-manifest.json
    to: models/model-manifest.json
  - from: .electron-resources/models/stt
    to: models/stt
asar: true
compression: normal
npmRebuild: false
electronLanguages:
  - en-US
linux:
  category: Utility
  executableName: ayla
  maintainer: Ayla Project <noreply@localhost>
  syncDesktopName: true
  icon: electron/assets/icon.png
  target:
    - AppImage
win:
  icon: electron/assets/icon.ico
mac:
  icon: electron/assets/icon.png
artifactName: ${productName}-${version}-linux-${arch}.${ext}
