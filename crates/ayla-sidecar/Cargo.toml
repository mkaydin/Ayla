[package]
name = "ayla-sidecar"
version = "0.1.0"
description = "Private MessagePack backend sidecar for the Ayla Electron host"
edition = "2021"
rust-version = "1.88.0"

[dependencies]
ayla-core = { path = "../ayla-core" }
rmp-serde = "1.3"
rmpv = { version = "1.3", features = ["with-serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
log = "0.4"
