[package]
name = "ayla-research"
version = "0.1.0"
description = "In-process scientific research pipeline for Ayla"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
anyhow = "1"
futures = "0.3"
lopdf = "0.34"
regex = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

